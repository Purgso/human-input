[project]
name = "human-input"
version = "1.0rc1"
description = "A Python library that adds realistic timing and movement to mouse and keyboard control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["automation", "human-like", "keyboard", "mouse", "input"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/Purgso/human-input"
Repository = "https://github.com/Purgso/human-input"
Issues = "https://github.com/Purgso/human-input/issues"

[[project.authors]]
name = "Purgso"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.uv.build-backend]
source-include = ["tests/**"]
